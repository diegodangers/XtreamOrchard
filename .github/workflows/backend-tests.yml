name: Backend tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r server/requirements.txt pytest
      - run: PYTHONPATH=server python -m pytest -q server/tests
      - name: Verify bundled HA app backend matches server
        run: |
          diff server/app/main.py homeassistant/xtream_orchard/app/main.py
          diff server/app/xtream.py homeassistant/xtream_orchard/app/xtream.py
          diff server/app/console.py homeassistant/xtream_orchard/app/console.py
          diff server/requirements.txt homeassistant/xtream_orchard/requirements.txt
  addon-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Home Assistant app image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.20 \
            -f homeassistant/xtream_orchard/Dockerfile \
            homeassistant/xtream_orchard
